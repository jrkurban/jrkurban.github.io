name: Bochum Aktuell aktualisieren

on:
  schedule:
    - cron: "0 5,15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Haberleri cek
        run: python scripts/fetch_news.py

      - name: Siteyi uret
        run: python scripts/build_site.py

      - name: Degisiklikleri commitle
        run: |
          git config user.name "bochum-news-bot"
          git config user.email "actions@github.com"
          git add data/news.json docs/index.html
          git diff --quiet --cached || git commit -m "Haberleri guncelle: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
