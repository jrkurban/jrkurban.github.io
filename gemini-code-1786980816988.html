<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gıcık Soru</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }

        .card {
            background: #2a2a2a;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 85%;
            max-width: 350px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 60px;
            position: relative;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
        }

        #evetBtn {
            background-color: #2ecc71;
            color: white;
        }

        #hayirBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="soru">Bana yanlış yaptığını kabul ediyor musun?</h1>
        <div class="btn-container">
            <button id="evetBtn" onclick="tebrikEt()">EVET</button>
            <button id="hayirBtn">HAYIR</button>
        </div>
    </div>

    <script>
        const hayirBtn = document.getElementById("hayirBtn");

        function kac(e) {
            if (e) e.preventDefault();

            const btnGenişlik = hayirBtn.offsetWidth;
            const btnYükseklik = hayirBtn.offsetHeight;

            const maxX = window.innerWidth - btnGenişlik - 20;
            const maxY = window.innerHeight - btnYükseklik - 20;

            const x = Math.max(20, Math.floor(Math.random() * maxX));
            const y = Math.max(20, Math.floor(Math.random() * maxY));

            hayirBtn.style.position = "fixed";
            hayirBtn.style.left = x + "px";
            hayirBtn.style.top = y + "px";
        }

        hayirBtn.addEventListener("touchstart", kac, { passive: false });
        hayirBtn.addEventListener("mouseover", kac);

        function tebrikEt() {
            document.getElementById("soru").innerText = "Aferin minik tavsan, hatanı kabul etmen güzel bir adım! 😉";
            hayirBtn.style.display = "none";
        }
    </script>

</body>
</html>
